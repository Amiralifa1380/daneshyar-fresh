name: Daneshyar Fresh 1.2.2 - Build and test APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug = test build; release = requires signing secrets'
        type: choice
        default: debug
        options: [debug, release]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-out source
        run: python3 UniversityAssistant/verify-version.py source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore private signing key
        env:
          SIGNING_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          BUILD_VARIANT: ${{ inputs.variant }}
        run: |
          if [ -n "$SIGNING_DATA" ]; then
            test -n "$SIGNING_PASSWORD"
            printf '%s' "$SIGNING_DATA" | base64 --decode > "$RUNNER_TEMP/daneshyar-signing.keystore"
            chmod 600 "$RUNNER_TEMP/daneshyar-signing.keystore"
            echo "ANDROID_SIGNING_FILE=$RUNNER_TEMP/daneshyar-signing.keystore" >> "$GITHUB_ENV"
          elif [ "$BUILD_VARIANT" = release ]; then
            echo 'Release requires ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD repository secrets.'
            exit 1
          fi
      - name: Build APK and run lint
        working-directory: UniversityAssistant
        env:
          BUILD_VARIANT: ${{ inputs.variant }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build-apk.sh
      - name: Upload built APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daneshyar-Fresh-APK-v1.2.2-${{ inputs.variant }}-run-${{ github.run_number }}
          path: |
            UniversityAssistant/dist/*.apk
            UniversityAssistant/dist/build-info.json
          if-no-files-found: warn
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash UniversityAssistant/run-android-tests.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daneshyar-Fresh-Reports-v1.2.2-run-${{ github.run_number }}
          path: |
            UniversityAssistant/app/build/reports/androidTests/
            UniversityAssistant/app/build/outputs/androidTest-results/
            UniversityAssistant/emulator.log
            UniversityAssistant/dist/build-info.json
          if-no-files-found: warn
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/daneshyar-signing.keystore"
